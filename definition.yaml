apiVersion: 1.3
image:
  imageType: iso
  arch: x86_64
  baseImage: SL-Micro.x86_64-6.2-Base-SelfInstall-GM.install.iso
  outputImageName: slmicro.iso
operatingSystem:
  isoConfiguration:
    installDevice: /dev/sda
  time:
    timezone: Europe/Paris
    ntp:
      forceWait: false
      servers:
        - 2.suse.pool.ntp.org
  users:
    - username: root
      encryptedPassword: ""
      createHomeDir: true
      sshKeys:
        - ssh-rsa 
  packages:
    sccRegistrationCode: ""   # build uniquement
    packageList:
      - open-iscsi  # requis par Longhorn
      - nfs-client                         
  systemd:
    enable:
      - iscsid
kubernetes:
  version: v1.36.3+rke2r1 #v1.36.3+rke2r1 # K3s v1.36.3+k3s1 # v1.35.9+rke2r1
  network:
    apiVIP: 192.168.1.235
    apiHost: edge.kubevirt.lab
  nodes:
    - hostname: node1
      type: server
      initializer: true
    - hostname: node2
      type: server
    - hostname: node3
      type: server
  helm:
    charts:
      - name: suse-storage
        releaseName: longhorn
        version: 1.12.2
        repositoryName: appco
        targetNamespace: longhorn-system
        createNamespace: true
        installationNamespace: kube-system
    repositories:
      - name: suse-edge
        url: oci://registry.suse.com/edge/charts
      - name: appco
        url: oci://dp.apps.rancher.io/charts
        authentication:
          username: redacted
          password: redacted
      - name: rancher-charts
        url: https://charts.rancher.io/
embeddedArtifactRegistry:
  registries:
    - uri: dp.apps.rancher.io
      authentication:
        username: redacted
        password: redacted
  images:
    # SUSE Storage 1.12.2 (Extrait de images-lock.yaml)
    - name: dp.apps.rancher.io/containers/kubernetes-csi-external-attacher:4.13.0-22.1
    - name: dp.apps.rancher.io/containers/kubernetes-csi-external-provisioner:5.3.0-22.1
    - name: dp.apps.rancher.io/containers/kubernetes-csi-external-resizer:2.3.0-15.1
    - name: dp.apps.rancher.io/containers/kubernetes-csi-external-snapshotter:8.7.0-22.1
    - name: dp.apps.rancher.io/containers/kubernetes-csi-livenessprobe:2.20.0-22.1
    - name: dp.apps.rancher.io/containers/kubernetes-csi-node-driver-registrar:2.18.0-22.1
    - name: dp.apps.rancher.io/containers/longhorn-backing-image-manager:1.12.2-6.1
    - name: dp.apps.rancher.io/containers/longhorn-engine:1.12.2-6.2
    - name: dp.apps.rancher.io/containers/longhorn-instance-manager:1.12.2-6.2
    - name: dp.apps.rancher.io/containers/longhorn-manager:1.12.2-6.1
    - name: dp.apps.rancher.io/containers/longhorn-share-manager:1.12.2-6.1
    - name: dp.apps.rancher.io/containers/longhorn-ui:1.12.2-6.1
    - name: dp.apps.rancher.io/containers/rancher-support-bundle-kit:1.0.5-2.1
